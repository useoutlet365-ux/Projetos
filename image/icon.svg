<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#080ce6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#080ce6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Shopping Bag / Modern Tag Icon -->
  <g transform="translate(106, 80)" filter="url(#glow)">
    <!-- Bag Handle -->
    <path d="M 90 90 C 90 35, 210 35, 210 90" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>
    <!-- Bag Body -->
    <rect x="30" y="80" width="240" height="250" rx="36" fill="#111322" stroke="url(#accentGrad)" stroke-width="12"/>
    
    <!-- Accent 365 & Lightning / Star inside bag -->
    <path d="M 150 120 L 125 190 L 165 190 L 135 270 L 195 180 L 155 180 Z" fill="#ffffff" opacity="0.95"/>
  </g>
  
  <!-- Text: OUTLET 365 -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    OUTLET<tspan fill="#3b82f6">365</tspan>
  </text>
</svg>